spring:
  application:
    name: doctor-service

  datasource:
    url: jdbc:postgresql://localhost:5432/doctor
    username: postgres
    password: BINH1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

    resilience4j:
      ratelimiter:
        instances:
          searchDoctorLimit:
            limit-for-period: 5
            limit-refresh-period: 10s
            timeout-duration: 0

    logging:
      level:
        io:
          github:
            resilience4j: DEBUG
